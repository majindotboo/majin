[package]
name = "majin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "async_executor"] }
bevy_ratatui = { git = "https://github.com/ratatui/bevy_ratatui.git", rev = "a9524d78c168af62c33f893af3389e3c63a54c06" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_fs = "1"
predicates = "3"
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.5"
rstest = "0.26"
static_assertions = "1"
